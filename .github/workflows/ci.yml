name: CI/CD

on:
  push:
    branches: [main, fase-2]
  pull_request:
    branches: [main, fase-2]

jobs:
  build-and-test:
    name: Build e testes (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (lint)
        run: npm run lint

      - name: Testes automatizados com cobertura
        run: npm test

      - name: Guardar relatório de cobertura
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  terraform-validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Inicializar (sem backend)
        run: terraform init -backend=false

      - name: Validar a configuração
        run: terraform validate

  docker-build-push:
    name: Imagem Docker (build, teste e publicação)
    needs: [build-and-test, terraform-validate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/fase-2' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem para teste
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: todo-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir o container e rodar o smoke test
        run: |
          docker run -d --name todo-api-test -p 3000:3000 todo-api:test
          bash scripts/smoke-test.sh http://localhost:3000

      - name: Mostrar logs do container (se falhar)
        if: failure()
        run: docker logs todo-api-test

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir as tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Deploy na EC2 (opcional)
    needs: docker-build-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o acesso SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Executar o script de deploy no servidor
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${EC2_HOST}" \
            "IMAGE=ghcr.io/${{ github.repository }}:latest bash -s" < scripts/deploy.sh

      - name: Verificar a API publicada
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: bash scripts/smoke-test.sh "http://${EC2_HOST}:3000"
